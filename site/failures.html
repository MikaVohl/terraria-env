<main id="main" class="wrap">
  <h1>Failures</h1>
  <p class="lead prose">A leaderboard number says how far an agent got. It does not say where the agent stopped or why. The failures below are the reasons the scores are what they are, and each one points at what the next agent or the next environment version has to fix.</p>
  <p class="prose" id="intro-data"></p>

      <button type="button" aria-pressed="false" data-kind="rl">RL</button>

  </section>
</main>
