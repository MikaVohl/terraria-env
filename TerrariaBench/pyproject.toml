[project]
name = "terrariabench-prototype"
version = "0.1.0"
description = "Full-game Terraria agent benchmark: offline scoring and observer prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
worker = ["evdev>=1.9,<2; sys_platform == 'linux'", "Pillow>=12,<13"]

[project.scripts]
terrariabench = "terrariabench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrariabench"]
